<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirection vers Chercher Dieu</title>
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://www.chercherdieu.com/">
  <meta http-equiv="refresh" content="0; url=https://www.chercherdieu.com/">
  <script>
    (function () {
      var destination = "https://www.chercherdieu.com" +
        window.location.pathname +
        window.location.search +
        window.location.hash;
      window.location.replace(destination);
    }());
  </script>
</head>
<body>
  <p>Redirection vers <a href="https://www.chercherdieu.com/">ChercherDieu.com</a>…</p>
</body>
</html>
